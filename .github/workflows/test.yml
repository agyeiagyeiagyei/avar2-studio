# Tests on every push and pull request: the Python package (ruff +
# pytest on ubuntu and macOS), the React frontend (lint, typecheck,
# unit tests, build) and the Rust crates (the fontc-web oracle tests
# against the Python implementations, a wasm32 compile check, and the
# Kinetikern2 engine on macOS). See docs/sprints/cleanup-2026-10 (T2.9).
name: Test

on:
  push:
    branches: [main, github-pages, cleanup-2026-10]
  pull_request:
    branches: [main, github-pages, cleanup-2026-10]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The fontc-gated tests look for the compiler at REPO/.venv/bin/fontc
      # (and next to the interpreter running pytest). A venv at .venv
      # satisfies both, so those tests run here instead of skipping. The
      # Kinetikern engine tests still skip: the dylib is not built here.
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"

      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest -q --durations=10

  cli-build:
    # C5: the command the docs promise is the command CI checks. Builds the
    # bundled example from the INSTALLED package (site-packages, run from a
    # directory outside the checkout) and fails the job on a non-zero exit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package (not a dev checkout)
        run: |
          python -m venv "$RUNNER_TEMP/cli-venv"
          "$RUNNER_TEMP/cli-venv/bin/pip" install .
          "$RUNNER_TEMP/cli-venv/bin/python" -c \
            "import avar2_studio, sys; p = avar2_studio.__file__; assert 'site-packages' in p, p; print(p)"

      - name: avar2-studio build (installed package, bundled example)
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/cli-venv/bin/avar2-studio" build \
            "$GITHUB_WORKSPACE/examples/crispy-mini/sources/CrispyMini.glyphs" \
            --out "$RUNNER_TEMP/out" --workdir "$RUNNER_TEMP/work"
          ls -l "$RUNNER_TEMP/out"

      - name: The checkout is untouched by the build
        run: |
          git -C "$GITHUB_WORKSPACE" status --porcelain --ignored | tee /dev/stderr
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --ignored)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cold cache: fontc and the fontations stack build from source,
      # 10+ minutes. Later runs restore both target/ dirs from here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            wasm/fontc-web
            native/kinetikern2

      # The oracle tests shell out to the Python implementations
      # (fontTools, gftools, axisregistry, avar2_studio) — the package
      # itself, no dev extras.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e .

      # The oracle fixtures are generated in-test (tests/common) from
      # examples/crispy-mini; nothing under /tmp is needed.
      - run: cargo test --manifest-path wasm/fontc-web/Cargo.toml
        env:
          AVAR2_PYTHON: ${{ github.workspace }}/.venv/bin/python

      # The browser target: proves the crate still compiles for wasm32
      # (wasm-pack's bindgen step is not needed for that). Platform
      # independent, so one leg is enough. Slow on a cold cache: every
      # dependency compiles again for the second target.
      - if: runner.os == 'Linux'
        run: cargo build --lib --target wasm32-unknown-unknown --manifest-path wasm/fontc-web/Cargo.toml

      # The Kinetikern2 engine is loaded by the Glyphs plugin as
      # libkinetikern2.dylib — a macOS artifact, built only there.
      - if: runner.os == 'macOS'
        run: cargo build --release --manifest-path native/kinetikern2/Cargo.toml
