name: Release

# Build the sdist + wheel (both carrying the React bundle), attach them
# to a GitHub Release and publish them to PyPI whenever a tag matching
# ``v*`` is pushed. Also runnable manually (workflow_dispatch): by
# default that only uploads the artifacts to the run page so the build
# can be checked without cutting a release; with ``publish_to:
# testpypi`` it also publishes them to TestPyPI as a dry run.
#
# Publishing uses PyPI trusted publishing — no API token in secrets.
# One-time setup: on pypi.org (and test.pypi.org for the dry run) add
# this repository as a trusted publisher of the ``avar2-studio``
# project, workflow ``release.yml``, environment ``pypi`` (``testpypi``
# on the test index).
#
# Version source: hatchling reads pyproject.toml's ``project.version``.
# Bump that version *before* you push the tag, otherwise the artifacts
# will not match the tag name.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish the build (manual runs only)'
        type: choice
        options:
          - none
          - testpypi
        default: none

permissions:
  contents: write   # needed by softprops/action-gh-release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build frontend
        working-directory: frontend
        env:
          # GitHub Actions sets CI=true automatically, which makes
          # create-react-app's `npm run build` treat ESLint warnings
          # as errors. There's a backlog of legacy unused-var and
          # exhaustive-deps warnings inherited from the Crispy port
          # that we'll clean up separately; until then, build without
          # the warnings-are-errors mode.
          CI: false
        run: |
          npm ci
          npm run build

      - name: Bundle frontend into the Python package
        run: |
          # The hatchling force-include in pyproject.toml copies
          # src/avar2_studio/static/ into the wheel as
          # avar2_studio/static/. Drop the .gitkeep placeholder and
          # rsync in the actual build output.
          rm -f src/avar2_studio/static/.gitkeep
          mkdir -p src/avar2_studio/static
          rsync -a frontend/build/ src/avar2_studio/static/
          ls -la src/avar2_studio/static/ | head -20

      - name: Build sdist and wheel
        # ``python -m build`` builds the sdist, then the wheel from the
        # unpacked sdist. The React bundle is gitignored, but
        # pyproject.toml lists it as an sdist artifact, so the sdist
        # carries it and the wheel built from it is the full studio.
        run: python -m build

      - name: Check the artifacts
        run: |
          twine check dist/*
          ls -la dist/

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
