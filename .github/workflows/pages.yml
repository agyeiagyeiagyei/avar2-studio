# Deploy the static demo to GitHub Pages (see docs/ARCHITECTURE.md).
# Modelled on fontspector's pages.yml: build artifacts in CI, deploy static.
name: Deploy static demo to Pages

on:
  push:
    branches: [main, github-pages]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The staging script needs the package (its example registry) and
      # the fontc binary pip installs with it.
      - run: pip install -e .

      # Stages each bundled example as a project zip plus a pristine
      # fontc compile into frontend/public/static-demo/ (gitignored
      # build artifact); the browser edits and rebuilds them itself.
      - run: python scripts/snapshot_static_demo.py

      # The wasm binary is not committed (decision 0014): build it here so
      # the static demo's fontc worker has it. Cold cache: fontc + fontations
      # compile from source for wasm32 (10+ min); rust-cache keeps it warm.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/fontc-web
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --release --target web --out-dir ../../frontend/src/wasm/fontc-web
        working-directory: wasm/fontc-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: frontend

      - run: npm run lint && npm run typecheck && npm run test:unit
        working-directory: frontend

      # Base = the repo's project-Pages path; dist-pages is a separate
      # outDir so this never clobbers the Flask-served build/.
      - run: npx vite build --base=/avar2-studio/ --outDir dist-pages
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
