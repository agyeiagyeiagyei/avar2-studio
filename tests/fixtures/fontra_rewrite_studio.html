<style id="avar2-studio-fontra-focus">
  /* Hide the sidebar panels that aren't useful for a brace-layer
     edit. avar2-studio seeds and manages the control-axis layers
     and navigates Fontra to the exact layer via the ↗ button.

     NOTE: the accordion SECTIONS inside designspace-navigation (the
     #font-axes / #glyph-sources items) live in a shadow DOM that
     injected global CSS can't reach — so hiding happens at the
     light-DOM container level (here) or via the shim script. */
  .sidebar-tab[data-sidebar-name="text-entry"],
  .sidebar-content[data-sidebar-name="text-entry"],
  .sidebar-tab[data-sidebar-name="selection-info"],
  .sidebar-content[data-sidebar-name="selection-info"],
  .sidebar-tab[data-sidebar-name="reference-font"],
  .sidebar-content[data-sidebar-name="reference-font"],
  .sidebar-tab[data-sidebar-name="glyph-search"],
  .sidebar-content[data-sidebar-name="glyph-search"],
  .sidebar-tab[data-sidebar-name="selection-transformation"],
  .sidebar-content[data-sidebar-name="selection-transformation"],
  .sidebar-tab[data-sidebar-name="glyph-note"],
  .sidebar-content[data-sidebar-name="glyph-note"],
  .sidebar-tab[data-sidebar-name="related-glyphs"],
  .sidebar-content[data-sidebar-name="related-glyphs"],
  .sidebar-tab[data-sidebar-name="characters-glyphs"],
  .sidebar-content[data-sidebar-name="characters-glyphs"] {
    display: none !important;
  }

  /* Top-level menu bar (File / Edit / View / Font / Glyph / Help).
     Not needed — the studio drives the editor. The edit tools live
     in a floating #edit-tools overlay, not a sidebar, so they
     survive. */
  .top-bar-container,
  menu-bar {
    display: none !important;
  }

  /* Edit tools — hide drawing tools, knife, shapes. Keep:
     pointer-tools (selection + drag), power-ruler-tool
     (measure), metrics-tool (sidebearings — kerning sub-tool
     stays visible inside the group), hand-tool (pan), and the
     entire zoom-tools group. Structural edits would also desync
     multi-source editing, so the pen stays hidden in studio
     sessions on purpose. */
  #edit-tools > .tool-button[data-tool="pen-tool"],
  #edit-tools > .tool-button[data-tool="pen-tool-cubic"],
  #edit-tools > .tool-button[data-tool="pen-tool-quad"],
  #edit-tools > .tool-button[data-tool="knife-tool"],
  #edit-tools > .tool-button[data-tool="shape-tool"],
  #edit-tools > .tool-button[data-tool="shape-tool-rectangle"],
  #edit-tools > .tool-button[data-tool="shape-tool-ellipse"],
  .tool-button.multi-tool[data-tool="pen-tool"],
  .tool-button.multi-tool[data-tool="shape-tool"] {
    display: none !important;
  }
</style>

<script id="avar2-studio-fontra-shim">
// avar2-studio Fontra shim — the SHARED desktop/embed implementation (T3.4).
// Built from fontra-embed @ 3de37a6 (src/metrics-hud.js + src/focused-ui.js +
// src/studio-shim-bootstrap.js) by build-studio-shim.mjs — DO NOT EDIT HERE:
// edit the fontra-embed sources, rebuild, re-copy. Injected into proxied
// Fontra pages by avar2-studio (routes/fontra.py); fontra/shim.js is the
// fallback when this file is absent.
(function () {
  "use strict";
// metrics-hud.js — the studio's reference-measurements HUD, part of the ONE
// shared studio-shim implementation (T3.4; see focused-ui.js's header for
// the two-host arrangement and the session-config shape).
//
// Correcting a glyph's horizontals means matching it to the glyphs that
// already read right — E's bar to H's, at the same designspace point.
// Fontra's ruler can measure what you have drawn, but it cannot tell you
// what to aim at, because the target lives in a different glyph. This HUD
// supplies those numbers: the host measures the reference glyphs at this
// layer's exact coordinates (the control axis pinned to default — the
// desktop's server measures the last build, the embed's bridge the pristine
// source model); the edited glyph's own row is its PRE-EDIT state, not what
// is on the canvas right now.
//
// Deliberately a plain DOM panel rather than a canvas visualization layer:
// it needs none of Fontra's internals, so a Fontra upgrade cannot silently
// break it. The ONE Fontra coupling is livePath() below, which reads
// window.editorController's scene model (set by the host's editor entry)
// — an API coupling, not a selector one.
//
// Loaded only for studio sessions with a glyph (applyFocusedUI gates it).
// The host supplies the reference figures: the embed's EmbedFont rides the
// bridge RPC, the desktop bootstrap fetches /api/control-axes/<tag>/
// reference-metrics; on hosts without the channel the call fails and the
// panel simply shows dashes.

// Scanline stroke measurement, matching the host's rule so the live and
// reference numbers are comparable: a horizontal cut low in the letter
// reads its vertical stems, a vertical cut mid-advance reads its
// horizontal bars, and the THINNEST run of each is the stroke weight.
function measure(contours, advance) {
  const runs = (coord, vertical) => {
    const vals = [];
    for (const c of contours) {
      for (let i = 0; i < c.length; i++) {
        const P = c[i];
        const Q = c[(i + 1) % c.length];
        const a1 = vertical ? P[0] : P[1];
        const b1 = vertical ? P[1] : P[0];
        const a2 = vertical ? Q[0] : Q[1];
        const b2 = vertical ? Q[1] : Q[0];
        if ((a1 <= coord && coord < a2) || (a2 <= coord && coord < a1)) {
          vals.push(b1 + ((coord - a1) * (b2 - b1)) / (a2 - a1));
        }
      }
    }
    vals.sort((x, y) => x - y);
    const out = [];
    for (let i = 0; i + 1 < vals.length; i += 2) {
      const w = vals[i + 1] - vals[i];
      if (w > 5) {
        out.push([w, vals[i], vals[i + 1]]);
      }
    }
    return out;
  };
  const ys = [];
  for (const c of contours) {
    for (const pt of c) {
      ys.push(pt[1]);
    }
  }
  if (!ys.length) {
    return {};
  }
  const yMin = Math.min(...ys);
  const yMax = Math.max(...ys);
  // Scan coordinates + the winning (thinnest) run extents ride along so
  // the overlay can draw EXACTLY what produced each number.
  const scanY = yMin + (yMax - yMin) * 0.25;
  const scanX = advance * 0.5;
  const stems = runs(scanY, false);
  const bars = runs(scanX, true);
  const r = { scanY, scanX };
  if (stems.length) {
    const m = stems.reduce((a, b) => (b[0] < a[0] ? b : a));
    r.stem = m[0];
    r.stemRun = [m[1], m[2]];
  }
  if (bars.length) {
    const m = bars.reduce((a, b) => (b[0] < a[0] ? b : a));
    r.bar = m[0];
    r.barRun = [m[1], m[2]];
  }
  if (r.stem && r.bar) {
    r.contrast = r.stem / r.bar;
  }
  return r;
}

// Fontra's live path for the glyph being edited: a flat coordinate array
// plus contourInfo endpoints. Reading it is what makes the figure track
// the points as they move, rather than reporting the last build.
function livePath() {
  const ec = window.editorController;
  const pg =
    ec &&
    ec.sceneController &&
    ec.sceneController.sceneModel &&
    ec.sceneController.sceneModel.getSelectedPositionedGlyph &&
    ec.sceneController.sceneModel.getSelectedPositionedGlyph();
  if (!pg || !pg.glyph || !pg.glyph.path) {
    return null;
  }
  const path = pg.glyph.path;
  const co = path.coordinates;
  const info = path.contourInfo;
  if (!co || !info) {
    return null;
  }
  const contours = [];
  let startPt = 0;
  for (const ci of info) {
    const pts = [];
    for (let i = startPt; i <= ci.endPoint; i++) {
      pts.push([co[i * 2], co[i * 2 + 1]]);
    }
    if (pts.length > 2) {
      contours.push(pts);
    }
    startPt = ci.endPoint + 1;
  }
  return { name: pg.glyph.name, contours, advance: pg.glyph.xAdvance };
}

// The location being edited RIGHT NOW: Fontra's scene follows the selected
// source/layer (axis-NAME-keyed, source space). The reference must be
// measured there — a glyph can carry several layers on the axis, and the
// session's opening layer is not necessarily the one on the canvas.
function editLocation() {
  const ec = window.editorController;
  const ss =
    ec &&
    ec.sceneController &&
    ((ec.sceneController.sceneModel && ec.sceneController.sceneModel.sceneSettings) ||
      ec.sceneController.sceneSettings);
  const loc = ss && ss.fontLocationSourceMapped;
  if (!loc || typeof loc !== "object") {
    return null;
  }
  const out = {};
  for (const k of Object.keys(loc)) {
    const v = Number(loc[k]);
    if (isFinite(v)) {
      out[k] = v;
    }
  }
  return Object.keys(out).length ? out : null;
}

function startMetricsHud(session, host) {
  const num = (v) =>
    v === undefined || v === null ? "\u2013" : (Math.round(v * 10) / 10).toFixed(1);
  let refData = null;
  let refGlyph = "";
  let lastLive = null;

  const box = document.createElement("div");
  box.id = "avar2-studio-metrics";
  box.innerHTML =
    '<div class="hd"></div>' +
    '<table><tr><th></th><th>bar</th><th>stem</th><th>s/b</th></tr>' +
    '<tr class="live"><td class="g"></td><td class="b"></td><td class="s"></td><td class="c"></td></tr>' +
    '<tr class="ref"><td class="g"><input id="avar2-ref-glyph" value="" placeholder="H" maxlength="12" spellcheck="false"></td>' +
    '<td class="b"></td><td class="s"></td><td class="c"></td></tr></table>' +
    '<div class="ft">live vs reference, measured at this location. ' +
    "Type a glyph name to compare \u2014 its outline is drawn in the editor " +
    "under the glyph (scan cuts marked). Clear the field to hide it.</div>";
  const st = document.createElement("style");
  st.textContent =
    "#avar2-studio-metrics{position:fixed;right:12px;bottom:12px;z-index:99999;" +
    "background:rgba(28,28,30,.94);color:#eee;font:11px/1.45 ui-monospace,monospace;" +
    "padding:8px 10px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.4);min-width:200px}" +
    "#avar2-studio-metrics .hd{color:#9a9aa0;margin-bottom:5px;font-size:10px}" +
    "#avar2-studio-metrics table{border-collapse:collapse;width:100%}" +
    "#avar2-studio-metrics th{color:#8a8a90;font-weight:400;text-align:right;" +
    "padding:0 0 2px 10px;font-size:10px}" +
    "#avar2-studio-metrics td{text-align:right;padding:1px 0 1px 10px}" +
    "#avar2-studio-metrics td.g{text-align:left;padding-left:0;color:#9a9aa0}" +
    "#avar2-studio-metrics tr.live td{color:#ffd479}" +
    "#avar2-studio-metrics input{width:5.5em;background:#3a3a3e;border:1px solid #55555a;" +
    "color:#eee;font:inherit;border-radius:3px;padding:0 3px}" +
    "#avar2-studio-metrics .ft{color:#7a7a80;margin-top:6px;font-size:9.5px;" +
    "max-width:215px;white-space:normal;line-height:1.35}";
  document.head.appendChild(st);
  document.body.appendChild(box);

  const cell = (sel, v) => {
    const e = box.querySelector(sel);
    if (e) {
      e.textContent = v;
    }
  };
  // CANVAS OVERLAY. The reference outline is drawn in the drawing editor
  // itself, under the glyph being edited: editorController
  // .visualizationLayers.definitions IS Fontra's live registry array, so a
  // definition spliced in at runtime (zIndex-ordered, exactly what
  // registerVisualizationLayerDefinition does) paints on every frame and
  // pans/zooms with the canvas. Scan cuts are marked on both shapes \u2014
  // gray for the reference, amber for the live glyph \u2014 so the table's
  // numbers are visible as geometry, in place, at drawing scale.
  const LAYER_ID = "avar2.studio.reference";
  const overlay = { contours: null, bbox: null, refCuts: null, liveCuts: null, sig: null };
  let layerInstalled = false;
  const repaint = () => {
    const ec = window.editorController;
    if (ec && ec.canvasController) {
      ec.canvasController.requestUpdate();
    }
  };
  const drawOverlay = (context, positionedGlyph, parameters) => {
    const contours = overlay.contours;
    if (!contours) {
      return;
    }
    const path = new Path2D();
    for (const c of contours) {
      path.moveTo(c[0][0], c[0][1]);
      for (let i = 1; i < c.length; i++) {
        path.lineTo(c[i][0], c[i][1]);
      }
      path.closePath();
    }
    context.fillStyle = parameters.fillColor;
    context.fill(path, "nonzero");
    const line = (x1, y1, x2, y2, color, width, dashed) => {
      context.strokeStyle = color;
      context.lineWidth = width;
      context.setLineDash(dashed ? [parameters.dash * 2, parameters.dash] : []);
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    };
    const bb = overlay.bbox;
    const cuts = (m, color) => {
      if (!m || !bb) {
        return;
      }
      if (m.scanY !== undefined) {
        line(bb.x0, m.scanY, bb.x1, m.scanY, color, parameters.hair, true);
      }
      if (m.scanX !== undefined) {
        line(m.scanX, bb.y0, m.scanX, bb.y1, color, parameters.hair, true);
      }
      if (m.stemRun) {
        line(m.stemRun[0], m.scanY, m.stemRun[1], m.scanY, color, parameters.bold, false);
      }
      if (m.barRun) {
        line(m.scanX, m.barRun[0], m.scanX, m.barRun[1], color, parameters.bold, false);
      }
    };
    cuts(overlay.refCuts, parameters.refColor);
    cuts(overlay.liveCuts, parameters.liveColor);
  };
  const installLayer = () => {
    if (layerInstalled) {
      return true;
    }
    const ec = window.editorController;
    const vl = ec && ec.visualizationLayers;
    if (!vl || !Array.isArray(vl.definitions)) {
      return false;
    }
    const def = {
      identifier: LAYER_ID,
      name: "avar2 reference overlay",
      selectionFunc: (visContext) => {
        if (!overlay.contours) {
          return [];
        }
        const pg =
          visContext.model.getSelectedPositionedGlyph &&
          visContext.model.getSelectedPositionedGlyph();
        return pg ? [pg] : [];
      },
      zIndex: 100,
      // screenParameters are divided by the magnification before draw, so
      // these are screen pixels: constant weight at any zoom.
      screenParameters: { hair: 1, bold: 4, dash: 7 },
      colors: {
        fillColor: "rgba(128,128,136,0.30)",
        refColor: "rgba(96,96,104,0.85)",
        liveColor: "rgba(200,128,0,0.9)",
      },
      colorsDarkMode: {
        fillColor: "rgba(170,170,180,0.28)",
        refColor: "rgba(190,190,200,0.85)",
        liveColor: "rgba(255,212,121,0.9)",
      },
      draw: drawOverlay,
    };
    let idx = 0;
    while (idx < vl.definitions.length && vl.definitions[idx].zIndex <= def.zIndex) {
      idx++;
    }
    vl.definitions.splice(idx, 0, def);
    vl.toggle(LAYER_ID, true);
    layerInstalled = true;
    return true;
  };
  const syncOverlay = () => {
    installLayer();
    const refM = refGlyph && refData && refData.metrics && refData.metrics[refGlyph];
    if (!refM || !refM.contours || !refM.contours.length) {
      if (overlay.contours) {
        overlay.contours = null;
        overlay.sig = null;
        repaint();
      }
      return;
    }
    const pts = [];
    for (const c of refM.contours) {
      for (const pt of c) {
        pts.push(pt);
      }
    }
    if (lastLive) {
      for (const c of lastLive.contours) {
        for (const pt of c) {
          pts.push(pt);
        }
      }
    }
    const xs = pts.map((pt) => pt[0]);
    const ysv = pts.map((pt) => pt[1]);
    const bb = {
      x0: Math.min(...xs),
      x1: Math.max(...xs),
      y0: Math.min(...ysv),
      y1: Math.max(...ysv),
    };
    const refCuts = measure(refM.contours, refM.advance || 0);
    const liveCuts = lastLive ? measure(lastLive.contours, lastLive.advance) : null;
    const sig = JSON.stringify([refGlyph, bb, refCuts, liveCuts]);
    if (sig !== overlay.sig) {
      overlay.bbox = bb;
      overlay.refCuts = refCuts;
      overlay.liveCuts = liveCuts;
      overlay.contours = refM.contours;
      overlay.sig = sig;
      repaint();
    }
  };
  const paintRef = () => {
    const m = refData && refData.metrics && refData.metrics[refGlyph];
    cell("tr.ref td.b", m ? num(m.bar) : "\u2013");
    cell("tr.ref td.s", m ? num(m.stem) : "\u2013");
    cell("tr.ref td.c", m && m.contrast ? m.contrast.toFixed(2) : "\u2013");
  };
  let fetchedLocKey = null;
  const loadRef = (g) => {
    refGlyph = g;
    if (!g) {
      // Blank is the OFF state: no reference row, no overlay.
      refData = null;
      fetchedLocKey = null;
      cell(".hd", "");
      paintRef();
      syncOverlay();
      return;
    }
    const loc = editLocation();
    fetchedLocKey = loc ? JSON.stringify(loc) : null;
    host
      .getReferenceMetrics(g, loc || undefined)
      .then((m) => {
        if (!m) {
          return;
        }
        refData = m;
        const loc = Object.entries(m.location || {})
          .filter(([k]) => k.toLowerCase() !== String(session.tag || "").toLowerCase())
          .map(([k, v]) => k + " " + v)
          .join(" \u00b7 ");
        cell(".hd", "at " + loc);
        paintRef();
        syncOverlay();
      })
      .catch(() => {});
  };
  const input = box.querySelector("#avar2-ref-glyph");
  input.addEventListener("change", () => loadRef(input.value.trim()));
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") {
      input.blur();
    }
  });
  paintRef();

  setInterval(() => {
    // Reference follows the canvas: switching layers (or nudging the
    // location) re-measures at the NEW location.
    if (refGlyph) {
      const loc = editLocation();
      const key = loc ? JSON.stringify(loc) : null;
      if (key && key !== fetchedLocKey) {
        loadRef(refGlyph);
      }
    }
    const lp = livePath();
    if (lp) {
      lastLive = lp;
      const m = measure(lp.contours, lp.advance);
      cell("tr.live td.g", lp.name);
      cell("tr.live td.b", num(m.bar));
      cell("tr.live td.s", num(m.stem));
      cell("tr.live td.c", m.contrast ? m.contrast.toFixed(2) : "\u2013");
    }
    syncOverlay();
  }, 400);
}

// focused-ui.js — the studio "focused editor" shim: THE ONE shared
// implementation for both studio hosts (T3.4; the desktop's
// avar2_studio/fontra/shim.js used to be a second, drifted copy).
//
//   - browser embed: bundled here, driven by the parent bridge
//     (avar2-studio frontend/src/editor-bridge.js) sending the session config
//     in the init message. The bridge enforces the actual write guards; this
//     module is UI-level narrowing only.
//   - desktop studio: avar2-studio's Fontra proxy injects a BUILT copy of
//     this file + metrics-hud.js (build-studio-shim.mjs → dist/studio-shim.js,
//     carried in avar2-studio as src/avar2_studio/fontra/embed-shim.js) with
//     the host bootstrap from src/studio-shim-bootstrap.js.
//
// Both hosts feed the SAME session shape: {studio, tag, axis_name,
// axis_default, glyph, auto_enable_edits?, allow_computed_edits?} — the
// bridge init message in the embed, GET /api/fontra-shim-config on the
// desktop. Non-studio sessions (harness, other hosts) get the full,
// unmodified UI.
//
// Reconciled divergences from the old desktop shim (its behavior is the
// reference):
//   - labelRe is regex-escaped and case-insensitive in BOTH hosts: labels
//     print the AUTHORED tag case, and a tag drift on either side must never
//     silently unmatch.
//   - the sources list sorts by source name (Fontra's own "by-source-name"
//     option), so the master/instance-labelled studio layers read A→Z by
//     style.
//   - the editing policy rides two session flags instead of diverging:
//     auto_enable_edits auto-enables studio rows once per layer (the embed
//     demo's behavior; the desktop leaves rows for the designer to toggle
//     deliberately); allow_computed_edits permits "→ computed" correction
//     targets as edit targets (the desktop — its writes self-heal on the
//     next shadow regen; the embed refuses them because the bridge guards
//     those layers read-only, so an enabled row would bounce EVERY edit).
//
// Why bundled: the studio's static demo iframes this bundle cross-origin and
// cannot inject CSS/JS into it, so the slimmed-down UI must ship inside the
// bundle itself for the license separation to hold without a server.
//
// ⚠ FONTRA VERSION DRIFT RISK — every selector below is coupled to the
// vendored Fontra DOM (googlefonts/fontra @ 726b854a1, see vendor.sh):
//   - sidebar tabs/contents: views-editor/src/sidebar.js sets
//     dataset.sidebarName (→ [data-sidebar-name="..."]) from each panel's
//     `identifier` property (views-editor/src/panel-*.js)
//   - edit tool buttons: views-editor/src/editor.js addEditTool() builds
//     #edit-tools > .tool-button[data-tool=...] plus .tool-button.multi-tool
//     wrappers; identifiers live in views-editor/src/edit-tools-*.js
//   - designspace-navigation internals: views-editor/src/
//     panel-designspace-navigation.js — the accordion items live TWO shadow
//     roots deep (panel → ui-accordion), rows come from ui-list's
//     .contents > .row[data-row-index]
// Re-audit THIS FILE when re-pinning Fontra; no other file in the bundle
// should carry these selectors.

// Sidebar panels not useful for a brace-layer edit, keyed by panel
// identifier. "designspace-navigation" stays: its sources list is the
// multi-source editing surface. "characters-glyphs" has no panel at the
// pinned commit (stale carry-over from the server shim) — the selector
// simply matches nothing.
const HIDDEN_SIDEBAR_PANELS = [
  "text-entry",
  "selection-info",
  "reference-font",
  "glyph-search",
  "selection-transformation",
  "glyph-note",
  "related-glyphs",
  "characters-glyphs",
];

// Top-level chrome. The sidebar containers must stay visible so the
// designspace-navigation panel has somewhere to live.
const HIDDEN_CHROME = [".top-bar-container", "menu-bar"];

// Drawing tools hidden in studio sessions: structural edits would desync
// multi-source editing. Kept: pointer-tools, power-ruler-tool, metrics-tool,
// hand-tool, and the whole zoom-tools group.
const HIDDEN_EDIT_TOOLS = [
  "pen-tool",
  "pen-tool-cubic",
  "pen-tool-quad",
  "knife-tool",
  "shape-tool",
  "shape-tool-rectangle",
  "shape-tool-ellipse",
];

// designspace-navigation internals trimmed down to the glyph-sources list.
const NAV_PANEL_NAME = "designspace-navigation";
const HIDDEN_ACCORDION_ITEMS = [
  "#font-axes-accordion-item",
  "#glyph-axes-accordion-item",
  "#glyph-layers-accordion-item",
  "#sources-list-add-remove-buttons",
];

function injectFocusCSS() {
  // The desktop proxy already injects the same rules server-side
  // (avar2_studio/fontra/focus.css) — don't double up there.
  if (document.getElementById("avar2-studio-fontra-focus")) {
    return;
  }
  const panelRules = HIDDEN_SIDEBAR_PANELS.map(
    (name) =>
      `.sidebar-tab[data-sidebar-name="${name}"],\n` +
      `  .sidebar-content[data-sidebar-name="${name}"]`
  ).join(",\n  ");
  const toolRules =
    HIDDEN_EDIT_TOOLS.map(
      (tool) => `#edit-tools > .tool-button[data-tool="${tool}"]`
    ).join(",\n  ") +
    ',\n  .tool-button.multi-tool[data-tool="pen-tool"],\n' +
    '  .tool-button.multi-tool[data-tool="shape-tool"]';
  const style = document.createElement("style");
  style.id = "fontra-embed-focus";
  style.textContent = `${panelRules},\n  ${HIDDEN_CHROME.join(
    ",\n  "
  )},\n  ${toolRules} {\n  display: none !important;\n}`;
  document.head.appendChild(style);
}

// A sources-list row is a studio layer when its dense location sits OFF the
// session axis's default — only sidecar seeding creates such layers.
// Fallback: match the seed-time source-name label ("<corner> · <tag> <value>").
function makeIsStudioItem(cfg) {
  const keys = [cfg.axis_name, cfg.tag].filter(Boolean);
  // Regex-escaped and case-insensitive: labels print the AUTHORED tag case,
  // and a tag drift on either side must never silently unmatch.
  const tagEsc = String(cfg.tag).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const labelRe = new RegExp("(^|[\\s,])" + tagEsc + "\\s+-?[\\d.]+", "i");
  return (item, sources) => {
    if (!item || item.isFontSource || item.isDefaultSource) {
      return false;
    }
    // A studio brace PINS this control axis explicitly in its own
    // source location — even when the pinned value IS the axis default
    // (the designer may rest the axis on the corrected end). Masters
    // never carry the key; the dense location always does (defaults
    // filled), which is why the old value!==default test went blind
    // once the default moved onto the braces' own value.
    const src =
      sources && typeof item.sourceIndex === "number"
        ? sources[item.sourceIndex]
        : null;
    const sparseLocation = (src && src.location) || null;
    if (sparseLocation) {
      for (const key of keys) {
        if (key in sparseLocation) {
          return true;
        }
      }
    }
    const denseLocation = item.denseLocation || {};
    for (const key of keys) {
      if (key in denseLocation) {
        return Number(denseLocation[key]) !== Number(cfg.axis_default);
      }
    }
    return labelRe.test(String(item.name || ""));
  };
}

// Rows the bridge labels "<label> → computed" are correction targets —
// re-derived on every build. Whether they may be editing targets rides the
// session's allow_computed_edits: the desktop allows them (writes into the
// shadow self-heal on regen); the embed refuses them, because its bridge
// guards writes per layer and rejects any editFinal touching a computed
// layer, so an enabled row would make EVERY edit bounce. The label is part
// of the bridge contract — the same contract the studio-item fallback above
// pattern-matches ("<corner> · <tag> <value>").
const COMPUTED_LABEL_RE = / → computed$/;

// Opens the designspace-navigation tab, sorts the sources list A→Z by
// source name, trims the panel to the sources list, then keeps the list
// narrowed to the session's brace-layer rows: studio rows stay visible;
// masters, font sources and other layers are hidden and never keep editing
// enabled. With the session's auto_enable_edits (the embed demo) studio
// rows also get multi-source editing enabled once per layer — the designer
// can still toggle a row off; without it (the desktop) rows come up
// untouched and an opened layer edits alone until toggled on. If no studio
// row exists the list is left untrimmed (fail open) and nothing is
// auto-enabled (fail closed).
function startSourcesSweep(cfg) {
  const isStudioItem = makeIsStudioItem(cfg);
  const autoEnable = cfg.auto_enable_edits === true;
  const allowComputed = cfg.allow_computed_edits === true;
  let tabOpened = false;
  let panelTrimmed = false;
  let sortSet = false;
  const autoEnabled = new Set();

  const sweep = () => {
    const host = document.querySelector(
      `.sidebar-content[data-sidebar-name="${NAV_PANEL_NAME}"]`
    );
    const panel = host && host.children[0];
    if (!panel || !panel.sourcesList) {
      return;
    }
    if (!sortSet) {
      // Alphabetical by source name — studio layers are labelled by
      // master/instance name, so the list reads A→Z by style. Retry until
      // the editor's settings object exists: the panel's DOM can be
      // queryable before the editor finishes wiring the controller.
      const settings =
        window.editorController &&
        window.editorController.sceneController &&
        window.editorController.sceneController.applicationSettings;
      if (settings) {
        if (settings.glyphSourcesSortOptions !== "by-source-name") {
          settings.glyphSourcesSortOptions = "by-source-name";
        }
        if (typeof panel._updateSources === "function") {
          panel._updateSources();
        }
        sortSet = true;
      }
    }
    if (!tabOpened) {
      const tab = document.querySelector(
        `.sidebar-tab[data-sidebar-name="${NAV_PANEL_NAME}"]`
      );
      if (tab && !tab.classList.contains("selected")) {
        tab.click();
      }
      tabOpened = true;
    }
    if (!panelTrimmed && panel.shadowRoot) {
      // The accordion items live TWO shadow roots deep —
      // panel-designspace-navigation#shadow > ui-accordion#shadow — so a
      // style appended to the panel's own root never reaches them.
      const rules = HIDDEN_ACCORDION_ITEMS.join(",") + "{display:none !important;}";
      const roots = [panel.shadowRoot];
      const accordion = panel.shadowRoot.querySelector("ui-accordion");
      if (accordion && accordion.shadowRoot) {
        roots.push(accordion.shadowRoot);
      }
      for (const root of roots) {
        const style = document.createElement("style");
        style.textContent = rules;
        root.appendChild(style);
      }
      // Only claim success once the inner root — the one that matters — was
      // actually reachable; otherwise retry on the next sweep, since the
      // accordion may not have upgraded yet.
      panelTrimmed = roots.length > 1;
    }
    const list = panel.sourcesList;
    const items = list.items || [];
    const ec = window.editorController;
    const positionedGlyph =
      ec &&
      ec.sceneController &&
      ec.sceneController.sceneModel &&
      ec.sceneController.sceneModel.getSelectedPositionedGlyph &&
      ec.sceneController.sceneModel.getSelectedPositionedGlyph();
    const sources =
      (positionedGlyph &&
        positionedGlyph.varGlyph &&
        positionedGlyph.varGlyph.glyph &&
        positionedGlyph.varGlyph.glyph.sources) ||
      null;
    const anyStudio = items.some((it) => isStudioItem(it, sources));
    const rows = list.shadowRoot
      ? list.shadowRoot.querySelectorAll(".contents > .row")
      : [];
    rows.forEach((row) => {
      const item = items[Number(row.dataset.rowIndex)];
      if (!item) {
        return;
      }
      const studio = isStudioItem(item, sources);
      const editTarget =
        studio && (allowComputed || !COMPUTED_LABEL_RE.test(String(item.name || "")));
      row.style.display = anyStudio && !studio ? "none" : "";
      if (!anyStudio) {
        return;
      }
      if (autoEnable && editTarget && !autoEnabled.has(item.layerName)) {
        autoEnabled.add(item.layerName);
        if (!item.editing) {
          item.editing = true;
        }
      } else if (!editTarget && item.editing) {
        // Hard rule: masters, source layers and (unless the host allows
        // computed edits) correction-target rows are never batch-edit
        // targets — Fontra's own init can put the selected source here, so
        // keep stripping it, not just once.
        item.editing = false;
      }
    });
  };
  setInterval(sweep, 500);
}

// Entry point. The embed calls it from embed-entry.js on init with the
// bridge session + the EmbedFont (whose getReferenceMetrics rides the
// bridge RPC); the desktop's standalone bootstrap (studio-shim-bootstrap.js)
// calls it with the /api/fontra-shim-config session + an HTTP metrics
// adapter. No-op for non-studio sessions. The metrics HUD rides the same
// gate, plus the session must name a glyph and the host must answer the
// metrics channel.
function applyFocusedUI(session, host) {
  if (!session?.studio) {
    return;
  }
  injectFocusCSS();
  startSourcesSweep(session);
  if (session.glyph && host) {
    startMetricsHud(session, host);
  }
}

// studio-shim-bootstrap.js — host bootstrap for the STANDALONE build of the
// studio shim. build-studio-shim.mjs concatenates src/metrics-hud.js +
// src/focused-ui.js + this file into one self-contained classic script
// (dist/studio-shim.js) that avar2-studio carries as
// src/avar2_studio/fontra/embed-shim.js and injects into proxied Fontra
// pages. The webpack bundle never imports this file — embed-entry.js drives
// applyFocusedUI directly with the init-message session.
//
// Both hosts feed the shim the SAME session shape ({studio, tag, axis_name,
// axis_default, glyph, auto_enable_edits?, allow_computed_edits?}); only the
// delivery and the reference-metrics channel differ:
//   - desktop (avar2-studio's Fontra proxy; the editor page is always served
//     under /fontra/): the session comes from GET /api/fontra-shim-config,
//     same origin; reference metrics over HTTP at
//     /api/control-axes/<tag>/reference-metrics.
//   - browser embed: the session rides the bridge init message (wire
//     protocol v0; embed-entry.js also stashes it on window.embedSession);
//     reference metrics go over the bridge's own postMessage RPC, with ids
//     namespaced ("shim-N") so they can't collide with the EmbedFont
//     channel's numeric ids.

const EMBED_MESSAGE_KEY = "avar2-embed";

function desktopMetricsHost(cfg) {
  return {
    getReferenceMetrics(refs, location) {
      return fetch(
        "/api/control-axes/" +
          encodeURIComponent(cfg.tag) +
          "/reference-metrics?glyph=" +
          encodeURIComponent(cfg.glyph || "") +
          "&refs=" +
          encodeURIComponent(refs) +
          (location ? "&location=" + encodeURIComponent(JSON.stringify(location)) : "")
      ).then((r) => (r.ok ? r.json() : null));
    },
  };
}

function embedMetricsHost() {
  let nextRequestId = 0;
  const pending = new Map();
  window.addEventListener("message", (event) => {
    const message = event.data;
    if (message?.[EMBED_MESSAGE_KEY] && message.type === "rpc-result" && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error !== undefined) {
        reject(new Error(message.error));
      } else {
        resolve(message.value);
      }
    }
  });
  return {
    getReferenceMetrics(refs, location) {
      const id = "shim-" + ++nextRequestId;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        window.parent.postMessage(
          {
            [EMBED_MESSAGE_KEY]: true,
            v: 0,
            type: "rpc",
            id,
            method: "getReferenceMetrics",
            args: [refs, location],
          },
          "*"
        );
      });
    },
  };
}

function bootstrapStudioShim(start) {
  const startIfStudio = (session, host) => {
    if (session?.studio) {
      start(session, host);
    }
  };
  if (window.embedSession) {
    // Embed, after the bundle's entry has consumed the init message.
    startIfStudio(window.embedSession, embedMetricsHost());
    return;
  }
  if (!location.pathname.startsWith("/fontra/")) {
    // Embed, before init: the session arrives in the bridge init message.
    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message?.[EMBED_MESSAGE_KEY] && message.type === "init") {
        startIfStudio(message.session, embedMetricsHost());
      }
    });
    return;
  }
  // Desktop studio proxy: same-origin session endpoint.
  fetch("/api/fontra-shim-config")
    .then((r) => r.json())
    .then((cfg) => startIfStudio(cfg, desktopMetricsHost(cfg)))
    .catch((e) => console.warn("avar2-studio shim:", e));
}

  bootstrapStudioShim(applyFocusedUI);
})();

</script>
