[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avar2-studio"
version = "0.1.0"
description = "Visual authoring and preview tool for avar2 variable fonts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Agyei Archer", email = "hello@agyei.design" },
]
keywords = ["variable-fonts", "avar2", "glyphs", "fontc", "type-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    # Majors-only upper bounds: fresh installs resolve latest, and breaking
    # API changes have arrived mid-major (glyphsLib 6.16: GSComponent.transform
    # became a plain tuple). The next major stays a deliberate review.
    "glyphsLib>=6.4,<7",
    "fontTools>=4.50",
    "fontc>=0.6,<2",
    "uharfbuzz>=0.39",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "gftools>=0.9",
    "flask-sock>=0.7",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
avar2-studio = "avar2_studio.cli:main"

[project.urls]
Homepage = "https://github.com/agyeiagyeiagyei/avar2-studio"
Demo = "https://agyeiagyeiagyei.github.io/avar2-studio/"
Issues = "https://github.com/agyeiagyeiagyei/avar2-studio/issues"

[tool.hatch.build.targets.sdist]
# The React bundle is gitignored (CI assembles it into static/). Carry it
# in the sdist anyway: a wheel built from the sdist is then the full
# studio rather than the headless install that answers 503.
artifacts = ["src/avar2_studio/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/avar2_studio"]
# static/ is supplied ONLY by the force-include below. Left to normal package
# discovery as well, the tracked .gitkeep is added to the archive twice
# ("A second file is being added to the wheel archive at the same path").
exclude = ["src/avar2_studio/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/avar2_studio/static" = "avar2_studio/static"

[tool.ruff]
line-length = 160
target-version = "py310"

# Baseline for the sprint: correctness + real-bug rules. Style-debt rules
# (UP*, BLE001, S110, long-annotation cleanups) are intentionally off until
# the T2.2 logging/error-handling migration decides them.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I001", "RUF100", "W"]
ignore = [
    "E402",   # module-level import not at top (server.py's guarded optional imports)
    "E501",   # long lines — the codebase's existing style
    "B905",   # zip() without strict= — sites zip parallel equal-length lists; strict=False is today's behavior
]

[tool.ruff.lint.per-file-ignores]
# Glyphs plugins use `from GlyphsApp import *` as the platform idiom.
"src/avar2_studio/glyphs/**" = ["F403", "F405"]

[tool.pytest.ini_options]
markers = [
    "real_jobs: the test runs the real build-job queue/worker (conftest's stub stays off)",
]
